# This file controls how pip installs the package and its dependencies
# To understand how to use it, see
# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
[tool.poetry]
name = "pituitary-nfpa"
version = "0.1.0"
# Add all run time dependencies here according to the format described here
# https://setuptools.pypa.io/en/latest/userguide/dependency_management.html#declaring-required-dependency
description = "Project for predicting recurrence in non-functioning pituitary adenomas"
authors = [ "Christopher P. Bridge <cbridge@mgh.harvard.edu>" ]
readme = "README.md"
homepage = "https://github.com/QTIM-Lab/pituitary-nfpa"
repository = "https://github.com/QTIM-Lab/pituitary-nfpa"
documentation = "https://github.com/QTIM-Lab/pituitary-nfpa/docs"
include = ["resources/*"]

[tool.poetry.dependencies]
python = "~3.12"
click = "^8.1.7"
importlib-resources = "^6.4.5"
monai = "^1.4.0"
numpy = "^1.23.0"
pycrumbs = "^0.3.1"
pydicom = "^2.4.1"
python-gdcm = "^3.0.24.1"
scikit-learn = "^1.6.0"
SimpleITK = "^2.4.0"
torch = "^2.5.1"
torchvision = "^0.20.1"
lightning = "^2.4.0"
mlflow = "^2.19.0"
polars = "^1.17.1"
fastexcel = ">=0.12.0,<1"
qtim-transforms = { git = "ssh://git@github.com/QTIM-Lab/qtim-transforms.git", branch = "main" }
huggingface-hub = "^0.27.0"
psutil = "^6.1.0"
pynvml = "^12.0.0"
tabpfn = "^2.1.3"
nvidia-nccl-cu11 = ">=2.0.0"  # don't understand why this is needed...

[tool.poetry.group.dev.dependencies]
# dev dependencies are those used when developing the package but are not needed
# to run. This mostly includes linters and other quality control tools.
# To install these packages, run "pip install -e ".[dev]""
# torch = { version = "^2.4.0", source = "torch-cu118" }
torch = "^2.4.0"
black = "^24.10.0"
coverage = "^7.6.9"
darglint = "^1.8.1"
flake8 = "^7.1.1"
flake8-docstrings = "^1.7.0"
importlib_resources = "^6.4.5"
ipython = "^8.30.0"
isort = "^5.13.2"
mypy = "^1.13.0"
nbstripout = "^0.8.1"
pep8-naming = "^0.14.1"
pre-commit = "^4.0.1"
pre-commit-hooks = "^5.0.0"
Pygments = "^2.18.0"
pytest = "^8.3.4"
typeguard = "^4.4.1"
jupyterlab = "^4.3.0"
visidata = "^3.1.1"
nibabel = "^5.3.2"

[tool.poetry.scripts]
pituitary-nfpa = "pituitary_nfpa.cli:run_cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
